[workspace]
members = ["crates/teamsearch*"]

resolver = "2"

[workspace.package]
authors = ["Alexander Fedotov <alexander.fedotov.uk@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/feds01/teamsearch"


[workspace.dependencies]
teamsearch_matcher = { path = "crates/teamsearch_matcher" }
teamsearch_utils = { path = "crates/teamsearch_utils" }
teamsearch_workspace = { path = "crates/teamsearch_workspace" }

anyhow = { version = "1.0.104" }
argfile = { version = "1.0.0" }
clap = { version = "4.6.7", features = ["derive"] }
colored = { version = "3.1.1" }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
ignore = "0.4.33"
index_vec = "0.1.4"
itertools = "0.15.0"
log = { version = "0.4", features = ["kv_unstable", "kv_serde"] }
once_cell = "1.21.4"
path-absolutize = "4.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
tempfile = "3.27"
wild = { version = "2" }

[profile.release]
opt-level = 3
lto = "fat"
debug-assertions = false
overflow-checks = false
codegen-units = 1
strip = true
debug = false

[profile.release-with-dbg-info]
inherits = "release"
debug = true
strip = false        # You'll want to disable stripping to keep debug symbols

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
